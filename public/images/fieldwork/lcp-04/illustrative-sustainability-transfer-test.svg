<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Sustainability Transfer Test</title>
  <desc id="desc">An illustrative path showing source, method, affected statement, decision history, current status and unresolved uncertainty travelling together when a sustainability statement is revisited.</desc>
  <rect width="1400" height="420" fill="#f7f9fc"/>
  <text x="48" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#123b7a">Illustrative Sustainability Transfer Test</text>
  <text x="48" y="91" font-family="Arial, sans-serif" font-size="17" fill="#38577f">What context must travel when a supplier factor or methodology changes?</text>
  <g font-family="Arial, sans-serif">
    <rect x="48" y="145" width="190" height="150" rx="16" fill="#e9f1ff" stroke="#8caee2" stroke-width="2"/>
    <text x="72" y="180" font-size="15" font-weight="700" fill="#38577f">SOURCE</text><text x="72" y="218" font-size="20" font-weight="700" fill="#123b7a">Supplier factor</text><text x="72" y="250" font-size="16" fill="#38577f">origin and version</text><text x="72" y="276" font-size="16" fill="#38577f">remain identifiable</text>
    <rect x="322" y="145" width="190" height="150" rx="16" fill="#edf8f1" stroke="#83bd99" stroke-width="2"/>
    <text x="346" y="180" font-size="15" font-weight="700" fill="#39754b">METHOD</text><text x="346" y="218" font-size="20" font-weight="700" fill="#245c38">Methodology</text><text x="346" y="250" font-size="16" fill="#39754b">assumption and</text><text x="346" y="276" font-size="16" fill="#39754b">change history</text>
    <rect x="596" y="145" width="190" height="150" rx="16" fill="#fff5e7" stroke="#e1b36f" stroke-width="2"/>
    <text x="620" y="180" font-size="15" font-weight="700" fill="#8c5a18">STATEMENT</text><text x="620" y="218" font-size="20" font-weight="700" fill="#74490f">Affected claim</text><text x="620" y="250" font-size="16" fill="#8c5a18">scope and affected</text><text x="620" y="276" font-size="16" fill="#8c5a18">calculation</text>
    <rect x="870" y="145" width="190" height="150" rx="16" fill="#f0ebff" stroke="#a996dc" stroke-width="2"/>
    <text x="894" y="180" font-size="15" font-weight="700" fill="#624b9b">DECISION</text><text x="894" y="218" font-size="20" font-weight="700" fill="#503b82">Review history</text><text x="894" y="250" font-size="16" fill="#624b9b">accepted, narrowed</text><text x="894" y="276" font-size="16" fill="#624b9b">or unresolved</text>
    <rect x="1144" y="145" width="208" height="150" rx="16" fill="#e8f4f5" stroke="#7fb8bc" stroke-width="2"/>
    <text x="1168" y="180" font-size="15" font-weight="700" fill="#35777a">CURRENT STATE</text><text x="1168" y="218" font-size="20" font-weight="700" fill="#245e61">Status + limits</text><text x="1168" y="250" font-size="16" fill="#35777a">current, changed or</text><text x="1168" y="276" font-size="16" fill="#35777a">still uncertain</text>
    <path d="M250 220h60M524 220h60M798 220h60M1072 220h60" stroke="#6c8dbb" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="48" y="342" width="1304" height="42" rx="12" fill="#fff1f1" stroke="#d78d8d"/>
    <text x="70" y="369" font-size="16" font-weight="700" fill="#8b3c3c">Illustrative transfer test — not external sector evidence, a customer case study, or a fabricated dashboard result.</text>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8dbb"/></marker></defs>
</svg>
